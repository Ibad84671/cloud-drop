AWSTemplateFormatVersion: '2010-09-09'
Description: CloudDrop production-minded serverless file transfer stack

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ArchiverLayerArn:
    Type: String
    Default: ''
    Description: Optional Lambda layer ARN containing the archiver package used by batch finalization.
  SesSourceEmail:
    Type: String
    Default: ''
    Description: Verified SES sender address. Required only when email sharing is used.
  FrontendOrigin:
    Type: String
    Default: '*'
    Description: Browser origin allowed to call the public API. Use the CloudFront URL in production; '*' preserves guest sharing during bootstrap.

Conditions:
  HasArchiverLayer: !Not [!Equals [!Ref ArchiverLayerArn, '']]
  HasSesSource: !Not [!Equals [!Ref SesSourceEmail, '']]

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub clouddrop-frontend-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal: {AWS: !Sub arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${OAI}}
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub clouddrop-uploads-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTransfers
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  OAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub CloudDrop ${Environment} frontend OAI

  CloudFrontFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub CloudDrop-Rewrite-${Environment}
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite transfer routes to the transfer page
        Runtime: cloudfront-js-1.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('/t/') === 0) request.uri = '/t.html';
          return request;
        }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub CloudDrop-Security-${Environment}
        SecurityHeadersConfig:
          StrictTransportSecurity: {Override: true, AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {Override: true, FrameOption: DENY}
          ReferrerPolicy: {Override: true, ReferrerPolicy: strict-origin-when-cross-origin}
          PermissionsPolicy: {Override: true, Policy: geolocation=(), microphone=(), camera=()}

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Frontend
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub origin-access-identity/cloudfront/${OAI}
        DefaultCacheBehavior:
          TargetOriginId: S3Frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !Ref CloudFrontFunction
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate: {CloudFrontDefaultCertificate: true}

  MetadataTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub CloudDrop-Metadata-${Environment}
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: {PointInTimeRecoveryEnabled: true}
      AttributeDefinitions:
        - {AttributeName: transferId, AttributeType: S}
        - {AttributeName: ownerId, AttributeType: S}
      KeySchema:
        - {AttributeName: transferId, KeyType: HASH}
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema: [{AttributeName: ownerId, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  CreateTransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: CreateTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt MetadataTable.Arn
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub ${UploadsBucket.Arn}/uploads/*

  CompleteTransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: CompleteTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt MetadataTable.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource: !Sub ${UploadsBucket.Arn}/uploads/*

  GetTransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: GetTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt MetadataTable.Arn
              - Effect: Allow
                Action: [s3:GetObject]
                Resource:
                  - !Sub ${UploadsBucket.Arn}/uploads/*
                  - !Sub ${UploadsBucket.Arn}/zips/*

  ListTransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: ListTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:Query]
                Resource:
                  - !GetAtt MetadataTable.Arn
                  - !Sub ${MetadataTable.Arn}/index/OwnerIndex

  DeleteTransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: DeleteTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:DeleteItem]
                Resource: !GetAtt MetadataTable.Arn
              - Effect: Allow
                Action: [s3:DeleteObject]
                Resource:
                  - !Sub ${UploadsBucket.Arn}/uploads/*
                  - !Sub ${UploadsBucket.Arn}/zips/*

  BatchCreateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: BatchCreateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem]
                Resource: !GetAtt MetadataTable.Arn
              - Effect: Allow
                Action: [s3:PutObject]
                Resource: !Sub ${UploadsBucket.Arn}/uploads/*

  BatchCompleteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: BatchCompleteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem]
                Resource: !GetAtt MetadataTable.Arn
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt UploadsBucket.Arn
                Condition: {StringLike: {s3:prefix: ['uploads/*']}}
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource:
                  - !Sub ${UploadsBucket.Arn}/uploads/*
                  - !Sub ${UploadsBucket.Arn}/zips/*

  SendEmailRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: SendEmailAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [ses:SendEmail]
                Resource: '*'

  CreateTransferFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt CreateTransferRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables: {TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket, MAX_FILE_SIZE: '2147483648'}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb');
          const {DynamoDBDocumentClient,PutCommand}=require('@aws-sdk/lib-dynamodb');
          const {S3Client,PutObjectCommand}=require('@aws-sdk/client-s3');
          const {getSignedUrl}=require('@aws-sdk/s3-request-presigner');
          const crypto=require('crypto'); const ddb=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s3=new S3Client({});
          const H={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Methods':'POST,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'};
          const out=(s,b)=>({statusCode:s,headers:H,body:JSON.stringify(b)});
          exports.handler=async e=>{try{const b=typeof e.body==='string'?JSON.parse(e.body):e.body||{};if(typeof b.fileName!=='string'||!b.fileName.trim()||b.fileName.length>255||!Number.isSafeInteger(b.fileSize)||b.fileSize<=0||b.fileSize>2147483648)return out(400,{success:false,error:{code:'INVALID_FILE',message:'Invalid file metadata.'}});const id=crypto.randomUUID(),key=`uploads/${crypto.randomUUID()}`,exp=new Date(Date.now()+604800000);await ddb.send(new PutCommand({TableName:process.env.TABLE_NAME,Item:{transferId:id,objectKey:key,originalFileName:b.fileName.trim(),fileSize:b.fileSize,contentType:typeof b.contentType==='string'?b.contentType:'application/octet-stream',status:'pending',createdAt:new Date().toISOString(),expiresAt:exp.toISOString(),ttl:Math.floor(exp.getTime()/1000),downloadCount:0,ownerId:e.requestContext?.authorizer?.claims?.sub||'guest'},ConditionExpression:'attribute_not_exists(transferId)'}));const url=await getSignedUrl(s3,new PutObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:key,ContentType:b.contentType||'application/octet-stream'}),{expiresIn:900});return out(201,{success:true,data:{transferId:id,uploadUrl:url,expiresAt:exp.toISOString()}})}catch(x){console.error('create-transfer failed',{name:x.name});return out(500,{success:false,error:{code:'INTERNAL_ERROR',message:'Unable to create transfer.'}})}};

  CompleteUploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt CompleteTransferRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment: {Variables: {TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket}}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,GetCommand,UpdateCommand}=require('@aws-sdk/lib-dynamodb'); const {S3Client,HeadObjectCommand}=require('@aws-sdk/client-s3'); const d=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s=new S3Client({}); const h={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Methods':'POST,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}; const o=(s,b)=>({statusCode:s,headers:h,body:JSON.stringify(b)});
          exports.handler=async e=>{try{const id=e?.pathParameters?.id;if(!id)return o(400,{success:false,error:{code:'INVALID_TRANSFER_ID',message:'Invalid transfer ID.'}});const i=(await d.send(new GetCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}))).Item;if(!i)return o(404,{success:false,error:{code:'TRANSFER_NOT_FOUND',message:'Transfer not found.'}});if(i.expiresAt&&Date.parse(i.expiresAt)<=Date.now())return o(410,{success:false,error:{code:'TRANSFER_EXPIRED',message:'Transfer expired.'}});if(i.status==='ready')return o(200,{success:true,data:{transferId:id,status:'ready'}});if(!i.objectKey)return o(409,{success:false,error:{code:'MISSING_OBJECT',message:'Upload metadata is incomplete.'}});try{await s.send(new HeadObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:i.objectKey}))}catch(x){if(x?.$metadata?.httpStatusCode===404||x.name==='NotFound')return o(409,{success:false,error:{code:'UPLOAD_NOT_FOUND',message:'The file has not finished uploading.'}});throw x}await d.send(new UpdateCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id},UpdateExpression:'SET #s=:r,completedAt=:t',ExpressionAttributeNames:{'#s':'status'},ExpressionAttributeValues:{':r':'ready',':t':new Date().toISOString()},ConditionExpression:'#s=:p'}));return o(200,{success:true,data:{transferId:id,status:'ready'}})}catch(x){if(x.name==='ConditionalCheckFailedException')return o(200,{success:true,data:{status:'ready'}});console.error('complete-upload failed',{name:x.name});return o(500,{success:false,error:{code:'INTERNAL_ERROR',message:'Unable to complete upload.'}})}};

  GetTransferFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt GetTransferRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment: {Variables: {TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket}}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,GetCommand,UpdateCommand}=require('@aws-sdk/lib-dynamodb'); const {S3Client,GetObjectCommand}=require('@aws-sdk/client-s3'); const {getSignedUrl}=require('@aws-sdk/s3-request-presigner'); const d=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s=new S3Client({}); const h={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Methods':'GET,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}; const o=(s,b)=>({statusCode:s,headers:h,body:JSON.stringify(b)}); const safe=n=>String(n||'download').replace(/[\r\n"\\/]/g,'_').slice(0,180)||'download';
          exports.handler=async e=>{try{const id=e?.pathParameters?.id;if(!id)return o(400,{success:false,error:{code:'INVALID_TRANSFER_ID',message:'Invalid transfer ID.'}});const i=(await d.send(new GetCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}))).Item;if(!i)return o(404,{success:false,error:{code:'TRANSFER_NOT_FOUND',message:'Transfer not found.'}});if(i.expiresAt&&Date.parse(i.expiresAt)<=Date.now())return o(410,{success:false,error:{code:'TRANSFER_EXPIRED',message:'Transfer expired.'}});if(i.status!=='ready')return o(409,{success:false,error:{code:'TRANSFER_NOT_READY',message:'This transfer is not ready.'}});const key=i.isBatch?i.zipKey:i.objectKey;if(!key)return o(500,{success:false,error:{code:'INVALID_STORAGE_REFERENCE',message:'Transfer storage metadata is invalid.'}});const name=safe(i.isBatch?key.split('/').pop():i.originalFileName);const url=await getSignedUrl(s,new GetObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:key,ResponseContentDisposition:`attachment; filename="${name}"`}),{expiresIn:300});d.send(new UpdateCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id},UpdateExpression:'ADD downloadCount :n',ExpressionAttributeValues:{':n':1}})).catch(x=>console.error('download counter failed',{name:x.name}));return o(200,{success:true,data:{downloadUrl:url,fileName:name,fileSize:i.isBatch?i.totalSize:i.fileSize,fileCount:i.isBatch?(i.files||[]).length:1,expiresAt:i.expiresAt}})}catch(x){console.error('get-transfer failed',{name:x.name});return o(500,{success:false,error:{code:'INTERNAL_ERROR',message:'Unable to prepare download.'}})}};

  ListTransfersFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt ListTransferRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment: {Variables: {TABLE_NAME: !Ref MetadataTable}}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,QueryCommand}=require('@aws-sdk/lib-dynamodb'); const d=DynamoDBDocumentClient.from(new DynamoDBClient({})); const h={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Methods':'GET,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}; const o=(s,b)=>({statusCode:s,headers:h,body:JSON.stringify(b)});
          exports.handler=async e=>{try{const owner=e?.requestContext?.authorizer?.claims?.sub||e?.requestContext?.authorizer?.jwt?.claims?.sub;if(!owner)return o(401,{success:false,error:{code:'UNAUTHORIZED',message:'Authentication required.'}});const r=await d.send(new QueryCommand({TableName:process.env.TABLE_NAME,IndexName:'OwnerIndex',KeyConditionExpression:'ownerId=:o',ExpressionAttributeValues:{':o':owner},ScanIndexForward:false,Limit:100}));return o(200,{success:true,data:r.Items||[]})}catch(x){console.error('list-transfers failed',{name:x.name});return o(500,{success:false,error:{code:'INTERNAL_ERROR',message:'Unable to load transfers.'}})}};

  DeleteTransferFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt DeleteTransferRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment: {Variables: {TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket}}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,GetCommand,DeleteCommand}=require('@aws-sdk/lib-dynamodb'); const {S3Client,DeleteObjectCommand}=require('@aws-sdk/client-s3'); const d=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s=new S3Client({}); const h={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Methods':'DELETE,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}; const o=(s,b)=>({statusCode:s,headers:h,body:JSON.stringify(b)});
          exports.handler=async e=>{try{const id=e?.pathParameters?.id,owner=e?.requestContext?.authorizer?.claims?.sub||e?.requestContext?.authorizer?.jwt?.claims?.sub;if(!owner)return o(401,{success:false,error:{code:'UNAUTHORIZED',message:'Authentication required.'}});const i=(await d.send(new GetCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}))).Item;if(!i)return o(404,{success:false,error:{code:'TRANSFER_NOT_FOUND',message:'Transfer not found.'}});if(i.ownerId!==owner)return o(403,{success:false,error:{code:'FORBIDDEN',message:'You cannot delete this transfer.'}});await d.send(new DeleteCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}));for(const key of [i.objectKey,i.zipKey])if(key)await s.send(new DeleteObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:key}));return o(200,{success:true,data:{deleted:true}})}catch(x){console.error('delete-transfer failed',{name:x.name});return o(500,{success:false,error:{code:'INTERNAL_ERROR',message:'Unable to delete transfer.'}})}};

  BatchCreateFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt BatchCreateRole.Arn
      Timeout: 20
      MemorySize: 256
      Environment: {Variables: {TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket, MAX_FILES: '20', MAX_TOTAL_SIZE: '2147483648'}}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,PutCommand}=require('@aws-sdk/lib-dynamodb'); const {S3Client,PutObjectCommand}=require('@aws-sdk/client-s3'); const {getSignedUrl}=require('@aws-sdk/s3-request-presigner'); const crypto=require('crypto'); const d=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s=new S3Client({}); const h={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Methods':'POST,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}; const o=(s,b)=>({statusCode:s,headers:h,body:JSON.stringify(b)});
          exports.handler=async e=>{try{const b=typeof e.body==='string'?JSON.parse(e.body):e.body||{},f=b.files;if(!Array.isArray(f)||!f.length||f.length>20)return o(400,{success:false,error:{code:'INVALID_FILES',message:'Choose between 1 and 20 files.'}});let total=0;for(const x of f){if(typeof x.fileName!=='string'||!x.fileName.trim()||x.fileName.length>255||!Number.isSafeInteger(x.fileSize)||x.fileSize<=0||x.fileSize>2147483648)return o(413,{success:false,error:{code:'FILE_TOO_LARGE',message:'One or more files are invalid or too large.'}});total+=x.fileSize;if(total>2147483648)return o(413,{success:false,error:{code:'TOTAL_TOO_LARGE',message:'Total upload size exceeds 2 GB.'}})}const id=crypto.randomUUID(),exp=new Date(Date.now()+604800000),files=f.map(x=>({fileName:x.fileName.trim(),fileSize:x.fileSize,contentType:x.contentType||'application/octet-stream',objectKey:`uploads/${id}/${crypto.randomUUID()}`}));await d.send(new PutCommand({TableName:process.env.TABLE_NAME,Item:{transferId:id,ownerId:e.requestContext?.authorizer?.claims?.sub||'guest',status:'pending',createdAt:new Date().toISOString(),expiresAt:exp.toISOString(),ttl:Math.floor(exp.getTime()/1000),totalSize:total,files,isBatch:true,downloadCount:0},ConditionExpression:'attribute_not_exists(transferId)'}));const uploads=await Promise.all(files.map(async x=>({fileName:x.fileName,uploadUrl:await getSignedUrl(s,new PutObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:x.objectKey,ContentType:x.contentType}),{expiresIn:900})})));return o(201,{success:true,data:{transferId:id,uploads,expiresAt:exp.toISOString()}})}catch(x){console.error('batch-create failed',{name:x.name});return o(500,{success:false,error:{code:'INTERNAL_ERROR',message:'Unable to create transfer.'}})}};

  BatchCompleteFunction:
    Type: AWS::Lambda::Function
    Condition: HasArchiverLayer
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt BatchCompleteRole.Arn
      Timeout: 300
      MemorySize: 1024
      Layers: [!Ref ArchiverLayerArn]
      Environment: {Variables: {TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket, MAX_ARCHIVE_BYTES: '2147483648'}}
      Code:
        ZipFile: |
          const {S3Client,ListObjectsV2Command,GetObjectCommand,PutObjectCommand}=require('@aws-sdk/client-s3'); const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,GetCommand,UpdateCommand}=require('@aws-sdk/lib-dynamodb'); const archiver=require('archiver'); const s=new S3Client({}); const d=DynamoDBDocumentClient.from(new DynamoDBClient({})); const h={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Methods':'POST,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}; const o=(s,b)=>({statusCode:s,headers:h,body:JSON.stringify(b)});
          exports.handler=async e=>{try{const id=e?.pathParameters?.id,i=(await d.send(new GetCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}))).Item;if(!i)return o(404,{success:false,error:{code:'TRANSFER_NOT_FOUND',message:'Transfer not found.'}});if(i.expiresAt&&Date.parse(i.expiresAt)<=Date.now())return o(410,{success:false,error:{code:'TRANSFER_EXPIRED',message:'Transfer expired.'}});if(i.status==='ready'&&i.zipKey)return o(200,{success:true,data:{transferId:id,status:'ready'}});const p=`uploads/${id}/`,r=await s.send(new ListObjectsV2Command({Bucket:process.env.UPLOADS_BUCKET,Prefix:p})),objects=(r.Contents||[]).filter(x=>x.Key&&x.Size>0);if(!objects.length)return o(409,{success:false,error:{code:'UPLOADS_NOT_FOUND',message:'No uploaded files were found.'}});const a=archiver('zip',{zlib:{level:6}}),chunks=[];a.on('data',c=>chunks.push(c));const err=new Promise((_,rej)=>a.on('error',rej));for(const x of objects){const body=await s.send(new GetObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:x.Key}));a.append(body.Body,{name:x.Key.slice(p.length).replace(/[\\/]/g,'_').slice(0,255)||'file'})}await a.finalize();await Promise.race([err,new Promise(res=>a.on('end',res))]);const buf=Buffer.concat(chunks);if(buf.length>2147483648)return o(413,{success:false,error:{code:'ARCHIVE_TOO_LARGE',message:'Generated archive exceeds 2 GB.'}});const zip=`zips/${id}.zip`;await s.send(new PutObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:zip,Body:buf,ContentType:'application/zip'}));await d.send(new UpdateCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id},UpdateExpression:'SET #s=:r,zipKey=:z,totalSize=:n,completedAt=:t',ExpressionAttributeNames:{'#s':'status'},ExpressionAttributeValues:{':r':'ready',':z':zip,':n':buf.length,':t':new Date().toISOString()},ConditionExpression:'#s=:p'}));return o(200,{success:true,data:{transferId:id,status:'ready'}})}catch(x){if(x.name==='ConditionalCheckFailedException')return o(200,{success:true,data:{status:'ready'}});console.error('batch-complete failed',{name:x.name});return o(500,{success:false,error:{code:'INTERNAL_ERROR',message:'Unable to finalize transfer.'}})}};

  SendEmailFunction:
    Type: AWS::Lambda::Function
    Condition: HasSesSource
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: !GetAtt SendEmailRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment: {Variables: {SES_SOURCE_EMAIL: !Ref SesSourceEmail}}
      Code:
        ZipFile: |
          const {SESClient,SendEmailCommand}=require('@aws-sdk/client-ses'); const s=new SESClient({}); const h={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Methods':'POST,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}; const o=(s,b)=>({statusCode:s,headers:h,body:JSON.stringify(b)}); const em=/^[^\s@]+@[^\s@]+\.[^\s@]+$/; const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          exports.handler=async e=>{try{const b=typeof e.body==='string'?JSON.parse(e.body):e.body||{};if(!em.test(String(b.to||''))||!/^https:\/\//i.test(String(b.link||'')))return o(400,{success:false,error:{code:'INVALID_EMAIL_REQUEST',message:'Invalid recipient or transfer link.'}});await s.send(new SendEmailCommand({Source:process.env.SES_SOURCE_EMAIL,Destination:{ToAddresses:[String(b.to).trim()]},Message:{Subject:{Data:`${String(b.fileName||'Files').slice(0,180)} shared via CloudDrop`,Charset:'UTF-8'},Body:{Text:{Data:`Download your files: ${b.link}`},Html:{Data:`<p>A file transfer has been shared with you.</p><p><strong>${esc(String(b.fileName||'Files').slice(0,180))}</strong></p><p><a href="${esc(b.link)}">Download files</a></p>`}}}}));return o(200,{success:true,data:{sent:true}})}catch(x){console.error('send-email failed',{name:x.name});return o(500,{success:false,error:{code:'EMAIL_SEND_FAILED',message:'Unable to send the transfer email.'}})}};

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub CloudDrop-UserPool-${Environment}
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies: {PasswordPolicy: {MinimumLength: 12, RequireUppercase: true, RequireLowercase: true, RequireNumbers: true, RequireSymbols: true}}

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub CloudDrop-Client-${Environment}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties: {Domain: !Sub clouddrop-${AWS::AccountId}-${Environment}, UserPoolId: !Ref CognitoUserPool}

  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties: {Name: !Sub CloudDrop-API-${Environment}, EndpointConfiguration: {Types: [REGIONAL]}}

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties: {Name: CognitoAuthorizer, RestApiId: !Ref ApiGateway, Type: COGNITO_USER_POOLS, IdentitySource: method.request.header.Authorization, ProviderARNs: [!GetAtt CognitoUserPool.Arn]}

  TransferResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !GetAtt ApiGateway.RootResourceId, PathPart: transfer}
  TransferIdResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !Ref TransferResource, PathPart: '{id}'}
  TransferCompleteResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !Ref TransferIdResource, PathPart: complete}
  UserResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !GetAtt ApiGateway.RootResourceId, PathPart: user}
  UserTransfersResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !Ref UserResource, PathPart: transfers}
  BatchResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !GetAtt ApiGateway.RootResourceId, PathPart: batch}
  BatchIdResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !Ref BatchResource, PathPart: '{id}'}
  BatchCompleteResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !Ref BatchIdResource, PathPart: complete}
  SendEmailResource:
    Type: AWS::ApiGateway::Resource
    Condition: HasSesSource
    Properties: {RestApiId: !Ref ApiGateway, ParentId: !GetAtt ApiGateway.RootResourceId, PathPart: send-email}

  TransferPost:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref ApiGateway, ResourceId: !Ref TransferResource, HttpMethod: POST, AuthorizationType: NONE, Integration: {IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTransferFunction.Arn}/invocations}}
  TransferGet:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref ApiGateway, ResourceId: !Ref TransferIdResource, HttpMethod: GET, AuthorizationType: NONE, Integration: {IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTransferFunction.Arn}/invocations}}
  TransferDelete:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref ApiGateway, ResourceId: !Ref TransferIdResource, HttpMethod: DELETE, AuthorizationType: COGNITO_USER_POOLS, AuthorizerId: !Ref CognitoAuthorizer, Integration: {IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteTransferFunction.Arn}/invocations}}
  TransferCompletePost:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref ApiGateway, ResourceId: !Ref TransferCompleteResource, HttpMethod: POST, AuthorizationType: NONE, Integration: {IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CompleteUploadFunction.Arn}/invocations}}
  UserTransfersGet:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref ApiGateway, ResourceId: !Ref UserTransfersResource, HttpMethod: GET, AuthorizationType: COGNITO_USER_POOLS, AuthorizerId: !Ref CognitoAuthorizer, Integration: {IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListTransfersFunction.Arn}/invocations}}
  BatchPost:
    Type: AWS::ApiGateway::Method
    Properties: {RestApiId: !Ref ApiGateway, ResourceId: !Ref BatchResource, HttpMethod: POST, AuthorizationType: NONE, Integration: {IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BatchCreateFunction.Arn}/invocations}}
  BatchCompletePost:
    Type: AWS::ApiGateway::Method
    Condition: HasArchiverLayer
    Properties: {RestApiId: !Ref ApiGateway, ResourceId: !Ref BatchCompleteResource, HttpMethod: POST, AuthorizationType: NONE, Integration: {IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BatchCompleteFunction.Arn}/invocations}}
  SendEmailPost:
    Type: AWS::ApiGateway::Method
    Condition: HasSesSource
    Properties: {RestApiId: !Ref ApiGateway, ResourceId: !Ref SendEmailResource, HttpMethod: POST, AuthorizationType: NONE, Integration: {IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SendEmailFunction.Arn}/invocations}}

  GatewayResponse4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties: {RestApiId: !Ref ApiGateway, ResponseType: DEFAULT_4XX, ResponseParameters: {'gatewayresponse.header.Access-Control-Allow-Origin': "'!'", 'gatewayresponse.header.Access-Control-Allow-Headers': "'Content-Type,Authorization'"}}
  GatewayResponse5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties: {RestApiId: !Ref ApiGateway, ResponseType: DEFAULT_5XX, ResponseParameters: {'gatewayresponse.header.Access-Control-Allow-Origin': "'!'", 'gatewayresponse.header.Access-Control-Allow-Headers': "'Content-Type,Authorization'"}}

  InvokeCreate: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref CreateTransferFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/transfer}}
  InvokeGet: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref GetTransferFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/GET/transfer/*}}
  InvokeDelete: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref DeleteTransferFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/DELETE/transfer/*}}
  InvokeComplete: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref CompleteUploadFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/transfer/*/complete}}
  InvokeList: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref ListTransfersFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/GET/user/transfers}}
  InvokeBatchCreate: {Type: AWS::Lambda::Permission, Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref BatchCreateFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/batch}}
  InvokeBatchComplete:
    Type: AWS::Lambda::Permission
    Condition: HasArchiverLayer
    Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref BatchCompleteFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/batch/*/complete}
  InvokeEmail:
    Type: AWS::Lambda::Permission
    Condition: HasSesSource
    Properties: {Action: lambda:InvokeFunction, FunctionName: !Ref SendEmailFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/send-email}

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [TransferPost, TransferGet, TransferDelete, TransferCompletePost, UserTransfersGet, BatchPost, BatchCompletePost, SendEmailPost]
    Properties: {RestApiId: !Ref ApiGateway, StageName: prod}

Outputs:
  CloudFrontURL: {Description: CloudFront frontend URL, Value: !Sub https://${CloudFrontDistribution.DomainName}}
  ApiGatewayURL: {Description: API Gateway URL, Value: !Sub https://${ApiGateway}.execute-api.${AWS::Region}.amazonaws.com/prod}
  FrontendBucketName: {Value: !Ref FrontendBucket}
  CloudFrontDistributionId: {Value: !Ref CloudFrontDistribution}
  CognitoUserPoolId: {Value: !Ref CognitoUserPool}
  CognitoClientId: {Value: !Ref CognitoUserPoolClient}
