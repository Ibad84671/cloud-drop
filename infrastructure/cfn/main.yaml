AWSTemplateFormatVersion: '2010-09-09'
Description: CloudDrop production serverless infrastructure

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ArtifactBucketName:
    Type: String
  CodeVersion:
    Type: String
  SesFromEmail:
    Type: String
    Default: ''

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'clouddrop-frontend-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'clouddrop-uploads-${Environment}-${AWS::AccountId}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTransfers
            Status: Enabled
            ExpirationInDays: 8
            NoncurrentVersionExpiration: { NoncurrentDays: 1 }
          - Id: AbortIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: ['*']
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposeHeaders: [ETag]
            MaxAge: 300

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub 'CloudDrop-OAC-${Environment}'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub 'CloudDrop-Rewrite-${Environment}'
      AutoPublish: true
      FunctionConfig:
        Comment: Rewrite transfer links to t.html.
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.indexOf('/t/') === 0) request.uri = '/t.html';
          return request;
        }

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        HttpVersion: http2and3
        Origins:
          - Id: FrontendOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig: {}
        DefaultCacheBehavior:
          TargetOriginId: FrontendOrigin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt CloudFrontFunction.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate: { CloudFrontDefaultCertificate: true }

  MetadataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub 'CloudDrop-Metadata-${Environment}'
      BillingMode: PAY_PER_REQUEST
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      AttributeDefinitions:
        - { AttributeName: transferId, AttributeType: S }
        - { AttributeName: ownerId, AttributeType: S }
      KeySchema: [{ AttributeName: transferId, KeyType: HASH }]
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema: [{ AttributeName: ownerId, KeyType: HASH }]
          Projection: { ProjectionType: ALL }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }

  BatchCompleteDLQ:
    Type: AWS::SQS::Queue
    Properties: { MessageRetentionPeriod: 1209600 }

  BatchCompleteQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 5400
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt BatchCompleteDLQ.Arn
        maxReceiveCount: 3

  UploadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }] }
      Policies:
        - PolicyName: UploadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: dynamodb:PutItem, Resource: !GetAtt MetadataTable.Arn }
              - { Effect: Allow, Action: s3:PutObject, Resource: !Sub '${UploadsBucket.Arn}/uploads/*' }
              - { Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*' }

  ReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }] }
      Policies:
        - PolicyName: ReadAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: [dynamodb:GetItem, dynamodb:UpdateItem], Resource: !GetAtt MetadataTable.Arn }
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub '${UploadsBucket.Arn}/uploads/*'
                  - !Sub '${UploadsBucket.Arn}/zips/*'
              - { Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*' }

  AuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }] }
      Policies:
        - PolicyName: AuthTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:DeleteItem], Resource: !GetAtt MetadataTable.Arn }
              - { Effect: Allow, Action: dynamodb:Query, Resource: !Sub '${MetadataTable.Arn}/index/OwnerIndex' }
              - Effect: Allow
                Action: s3:DeleteObject
                Resource:
                  - !Sub '${UploadsBucket.Arn}/uploads/*'
                  - !Sub '${UploadsBucket.Arn}/zips/*'
              - { Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*' }

  QueueRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }] }
      Policies:
        - PolicyName: QueueAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: [dynamodb:GetItem, dynamodb:UpdateItem], Resource: !GetAtt MetadataTable.Arn }
              - { Effect: Allow, Action: sqs:SendMessage, Resource: !GetAtt BatchCompleteQueue.Arn }
              - { Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*' }

  WorkerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }] }
      Policies:
        - PolicyName: ZipWorkerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: [dynamodb:GetItem, dynamodb:UpdateItem], Resource: !GetAtt MetadataTable.Arn }
              - { Effect: Allow, Action: s3:GetObject, Resource: !Sub '${UploadsBucket.Arn}/uploads/*' }
              - { Effect: Allow, Action: [s3:PutObject, s3:AbortMultipartUpload], Resource: !Sub '${UploadsBucket.Arn}/zips/*' }
              - { Effect: Allow, Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes], Resource: !GetAtt BatchCompleteQueue.Arn }
              - { Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*' }

  EmailRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: { Version: '2012-10-17', Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }] }
      Policies:
        - PolicyName: EmailAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - { Effect: Allow, Action: ses:SendEmail, Resource: '*' }
              - { Effect: Allow, Action: [dynamodb:GetItem, dynamodb:UpdateItem], Resource: !GetAtt MetadataTable.Arn }
              - { Effect: Allow, Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents], Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*' }

  CreateTransferFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt UploadRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment: { Variables: { TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket } }
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/create-transfer-${CodeVersion}.zip' }

  CompleteUploadFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt ReadRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment: { Variables: { TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket } }
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/complete-upload-${CodeVersion}.zip' }

  GetTransferFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt ReadRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment: { Variables: { TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket } }
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/get-transfer-${CodeVersion}.zip' }

  ListTransfersFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt AuthRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment: { Variables: { TABLE_NAME: !Ref MetadataTable } }
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/list-transfers-${CodeVersion}.zip' }

  DeleteTransferFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt AuthRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment: { Variables: { TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket } }
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/delete-transfer-${CodeVersion}.zip' }

  BatchCreateFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt UploadRole.Arn
      Timeout: 15
      MemorySize: 256
      Environment: { Variables: { TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket } }
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/batch-create-${CodeVersion}.zip' }

  BatchCompleteEnqueueFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt QueueRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment: { Variables: { TABLE_NAME: !Ref MetadataTable, QUEUE_URL: !Ref BatchCompleteQueue } }
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/batch-complete-enqueue-${CodeVersion}.zip' }

  BatchCompleteFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt WorkerRole.Arn
      Timeout: 900
      MemorySize: 1024
      Environment: { Variables: { TABLE_NAME: !Ref MetadataTable, UPLOADS_BUCKET: !Ref UploadsBucket } }
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/batch-complete-${CodeVersion}.zip' }

  SendEmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs24.x
      Handler: index.handler
      Role: !GetAtt EmailRole.Arn
      Timeout: 10
      MemorySize: 256
      Environment:
        Variables:
          FROM_EMAIL: !Ref SesFromEmail
          TABLE_NAME: !Ref MetadataTable
          FRONTEND_ORIGIN: !Sub 'https://${CloudFrontDistribution.DomainName}'
      Code: { S3Bucket: !Ref ArtifactBucketName, S3Key: !Sub 'lambdas/send-email-${CodeVersion}.zip' }

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'CloudDrop-UserPool-${Environment}'
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy: { MinimumLength: 10, RequireUppercase: true, RequireLowercase: true, RequireNumbers: true, RequireSymbols: true, TemporaryPasswordValidityDays: 1 }
      AccountRecoverySetting:
        RecoveryMechanisms: [{ Name: verified_email, Priority: 1 }]
      Schema: [{ Name: email, Required: true, Mutable: true }]

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'CloudDrop-Client-${Environment}'
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub 'CloudDrop-API-${Environment}'
      EndpointConfiguration: { Types: [REGIONAL] }
      MinimumCompressionSize: 1024

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CloudDropCognitoAuthorizer
      RestApiId: !Ref ApiGateway
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs: [!GetAtt CognitoUserPool.Arn]

  TransferResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !GetAtt ApiGateway.RootResourceId, PathPart: transfer }
  TransferIdResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !Ref TransferResource, PathPart: '{id}' }
  TransferCompleteResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !Ref TransferIdResource, PathPart: complete }
  UserResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !GetAtt ApiGateway.RootResourceId, PathPart: user }
  UserTransfersResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !Ref UserResource, PathPart: transfers }
  BatchResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !GetAtt ApiGateway.RootResourceId, PathPart: batch }
  BatchIdResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !Ref BatchResource, PathPart: '{id}' }
  BatchCompleteResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !Ref BatchIdResource, PathPart: complete }
  SendEmailResource:
    Type: AWS::ApiGateway::Resource
    Properties: { RestApiId: !Ref ApiGateway, ParentId: !GetAtt ApiGateway.RootResourceId, PathPart: send-email }

  TransferPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TransferResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: { IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CreateTransferFunction.Arn}/invocations' }
  TransferGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TransferIdResource
      HttpMethod: GET
      AuthorizationType: NONE
      Integration: { IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetTransferFunction.Arn}/invocations' }
  TransferCompletePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TransferCompleteResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: { IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${CompleteUploadFunction.Arn}/invocations' }
  UserTransfersGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref UserTransfersResource
      HttpMethod: GET
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration: { IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ListTransfersFunction.Arn}/invocations' }
  TransferDeleteMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TransferIdResource
      HttpMethod: DELETE
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      Integration: { IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${DeleteTransferFunction.Arn}/invocations' }
  BatchPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref BatchResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: { IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BatchCreateFunction.Arn}/invocations' }
  BatchCompletePostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref BatchCompleteResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: { IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${BatchCompleteEnqueueFunction.Arn}/invocations' }
  SendEmailPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref SendEmailResource
      HttpMethod: POST
      AuthorizationType: NONE
      Integration: { IntegrationHttpMethod: POST, Type: AWS_PROXY, Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${SendEmailFunction.Arn}/invocations' }

  TransferOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TransferResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":204}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
  TransferIdOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TransferIdResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":204}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,DELETE,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
  TransferCompleteOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref TransferCompleteResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":204}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
  UserTransfersOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref UserTransfersResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":204}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
  BatchOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref BatchResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":204}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
  BatchCompleteOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref BatchCompleteResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":204}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true
  SendEmailOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref ApiGateway
      ResourceId: !Ref SendEmailResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates: { application/json: '{"statusCode":204}' }
        IntegrationResponses:
          - StatusCode: '204'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: "'*'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
      MethodResponses:
        - StatusCode: '204'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Methods: true
            method.response.header.Access-Control-Allow-Headers: true

  Default4xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: DEFAULT_4XX
      ResponseParameters: { gatewayresponse.header.Access-Control-Allow-Origin: "'*'", gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'" }
  Default5xx:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref ApiGateway
      ResponseType: DEFAULT_5XX
      ResponseParameters: { gatewayresponse.header.Access-Control-Allow-Origin: "'*'", gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'" }

  InvokeCreate:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref CreateTransferFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/transfer' }
  InvokeGet:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref GetTransferFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/GET/transfer/*' }
  InvokeComplete:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref CompleteUploadFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/transfer/*/complete' }
  InvokeList:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref ListTransfersFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/GET/user/transfers' }
  InvokeDelete:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref DeleteTransferFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/DELETE/transfer/*' }
  InvokeBatch:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref BatchCreateFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/batch' }
  InvokeBatchComplete:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref BatchCompleteEnqueueFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/batch/*/complete' }
  InvokeEmail:
    Type: AWS::Lambda::Permission
    Properties: { Action: lambda:InvokeFunction, FunctionName: !Ref SendEmailFunction, Principal: apigateway.amazonaws.com, SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGateway}/*/POST/send-email' }

  BatchCompleteMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt BatchCompleteQueue.Arn
      FunctionName: !Ref BatchCompleteFunction
      BatchSize: 1
      Enabled: true
      FunctionResponseTypes: [ReportBatchItemFailures]

  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [TransferPostMethod, TransferGetMethod, TransferCompletePostMethod, UserTransfersGetMethod, TransferDeleteMethod, BatchPostMethod, BatchCompletePostMethod, SendEmailPostMethod, TransferOptions, TransferIdOptions, TransferCompleteOptions, UserTransfersOptions, BatchOptions, BatchCompleteOptions, SendEmailOptions]
    Properties: { RestApiId: !Ref ApiGateway }

  ApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref ApiGateway
      DeploymentId: !Ref ApiDeployment
      StageName: prod
      MethodSettings:
        - ResourcePath: '/*'
          HttpMethod: '*'
          MetricsEnabled: true
          DataTraceEnabled: false
          ThrottlingRateLimit: 20
          ThrottlingBurstLimit: 40

Outputs:
  CloudFrontURL:
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  ApiGatewayURL:
    Value: !Sub 'https://${ApiGateway}.execute-api.${AWS::Region}.${AWS::URLSuffix}/prod'
  CognitoUserPoolId:
    Value: !Ref CognitoUserPool
  CognitoClientId:
    Value: !Ref CognitoUserPoolClient
  FrontendBucketName:
    Value: !Ref FrontendBucket
  UploadsBucketName:
    Value: !Ref UploadsBucket