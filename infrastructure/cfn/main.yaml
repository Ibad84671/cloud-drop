AWSTemplateFormatVersion: '2010-09-09'
Description: CloudDrop secure, guest-first serverless file-sharing platform.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  ArchiverLayerArn:
    Type: String
    Default: ''
    Description: Lambda layer ARN providing archiver for multi-file ZIP creation.
  SesSourceEmail:
    Type: String
    Default: ''
    Description: Verified SES sender address. Optional email-sharing feature.

Conditions:
  HasArchiverLayer: {Fn::Not: [{Fn::Equals: [{Ref: ArchiverLayerArn}, '']}]}
  HasSesSource: {Fn::Not: [{Fn::Equals: [{Ref: SesSourceEmail}, '']}]}

Resources:
  FrontendBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: {Fn::Sub: 'clouddrop-frontend-${Environment}-${AWS::AccountId}'}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: {Ref: FrontendBucket}
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal: {AWS: {Fn::Sub: 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${OAI}'}}
            Action: s3:GetObject
            Resource: {Fn::Sub: '${FrontendBucket.Arn}/*'}

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: {Fn::Sub: 'clouddrop-uploads-${Environment}-${AWS::AccountId}'}
      PublicAccessBlockConfiguration: {BlockPublicAcls: true, BlockPublicPolicy: true, IgnorePublicAcls: true, RestrictPublicBuckets: true}
      BucketEncryption: {ServerSideEncryptionConfiguration: [{ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}}]}
      LifecycleConfiguration:
        Rules: [{Id: ExpireTransferObjects, Status: Enabled, ExpirationInDays: 8}]
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [{Fn::Sub: 'https://${CloudFrontDistribution.DomainName}'}]
            AllowedMethods: [PUT, GET, HEAD]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000

  OAI:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: {Fn::Sub: 'CloudDrop frontend origin identity (${Environment})'}

  CloudFrontFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: {Fn::Sub: 'CloudDrop-Rewrite-${Environment}-${AWS::AccountId}'}
      AutoPublish: true
      FunctionConfig: {Comment: Rewrite /t/<id> to the static transfer page., Runtime: cloudfront-js-1.0}
      FunctionCode: |
        function handler(event) { var r=event.request; if(r.uri.indexOf('/t/')===0) r.uri='/t.html'; return r; }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: {Fn::Sub: 'CloudDrop-Security-${Environment}-${AWS::AccountId}'}
        SecurityHeadersConfig:
          StrictTransportSecurity: {Override: true, AccessControlMaxAgeSec: 31536000, IncludeSubdomains: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {Override: true, FrameOption: DENY}
          ReferrerPolicy: {Override: true, ReferrerPolicy: strict-origin-when-cross-origin}
          ContentSecurityPolicy:
            ContentSecurityPolicy: {Fn::Sub: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://clouddrop-${AWS::AccountId}-${Environment}.auth.${AWS::Region}.amazoncognito.com; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.execute-api.${AWS::Region}.amazonaws.com https://cognito-idp.${AWS::Region}.amazonaws.com https://clouddrop-${AWS::AccountId}-${Environment}.auth.${AWS::Region}.amazoncognito.com https://clouddrop-uploads-${Environment}-${AWS::AccountId}.s3.${AWS::Region}.amazonaws.com; img-src 'self' data:; font-src 'self' data:;"}
            Override: true

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: S3Frontend
            DomainName: {Fn::GetAtt: [FrontendBucket, RegionalDomainName]}
            S3OriginConfig: {OriginAccessIdentity: {Fn::Sub: 'origin-access-identity/cloudfront/${OAI}'}}
        DefaultCacheBehavior:
          TargetOriginId: S3Frontend
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: {Ref: SecurityHeadersPolicy}
          FunctionAssociations: [{EventType: viewer-request, FunctionARN: {Ref: CloudFrontFunction}}]
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
          - {ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html, ErrorCachingMinTTL: 0}
        ViewerCertificate: {CloudFrontDefaultCertificate: true}

  MetadataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: {Fn::Sub: 'CloudDrop-Metadata-${Environment}'}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: transferId, AttributeType: S}, {AttributeName: ownerId, AttributeType: S}]
      KeySchema: [{AttributeName: transferId, KeyType: HASH}]
      GlobalSecondaryIndexes:
        - IndexName: OwnerIndex
          KeySchema: [{AttributeName: ownerId, KeyType: HASH}]
          Projection: {ProjectionType: ALL}
      TimeToLiveSpecification: {AttributeName: ttl, Enabled: true}

  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: {Fn::Sub: 'CloudDrop-UserPool-${Environment}'}
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy: {MinimumLength: 8, RequireUppercase: true, RequireLowercase: true, RequireNumbers: true, RequireSymbols: true}
      AccountRecoverySetting:
        RecoveryMechanisms: [{Name: verified_email, Priority: 1}]

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: {Ref: CognitoUserPool}
      ClientName: {Fn::Sub: 'CloudDrop-Web-${Environment}'}
      GenerateSecret: false
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email, profile]
      SupportedIdentityProviders: [COGNITO]
      CallbackURLs: [{Fn::Sub: 'https://${CloudFrontDistribution.DomainName}/auth-callback.html'}]
      LogoutURLs: [{Fn::Sub: 'https://${CloudFrontDistribution.DomainName}/'}]
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]

  CognitoUserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: {Fn::Sub: 'clouddrop-${AWS::AccountId}-${Environment}'}
      UserPoolId: {Ref: CognitoUserPool}

  ApiGateway:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: {Fn::Sub: 'CloudDrop-${Environment}'}
      EndpointConfiguration: {Types: [REGIONAL]}
      MinimumCompressionSize: 1024

  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CloudDropCognitoAuthorizer
      RestApiId: {Ref: ApiGateway}
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      ProviderARNs: [{Fn::GetAtt: [CognitoUserPool, Arn]}]

  BatchResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: {Ref: ApiGateway}, ParentId: {Fn::GetAtt: [ApiGateway, RootResourceId]}, PathPart: batch}
  BatchIdResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: {Ref: ApiGateway}, ParentId: {Ref: BatchResource}, PathPart: '{id}'}
  BatchCompleteResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: {Ref: ApiGateway}, ParentId: {Ref: BatchIdResource}, PathPart: complete}
  TransferResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: {Ref: ApiGateway}, ParentId: {Fn::GetAtt: [ApiGateway, RootResourceId]}, PathPart: transfer}
  TransferIdResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: {Ref: ApiGateway}, ParentId: {Ref: TransferResource}, PathPart: '{id}'}
  UserResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: {Ref: ApiGateway}, ParentId: {Fn::GetAtt: [ApiGateway, RootResourceId]}, PathPart: user}
  UserTransfersResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: {Ref: ApiGateway}, ParentId: {Ref: UserResource}, PathPart: transfers}
  SendEmailResource:
    Type: AWS::ApiGateway::Resource
    Properties: {RestApiId: {Ref: ApiGateway}, ParentId: {Fn::GetAtt: [ApiGateway, RootResourceId]}, PathPart: send-email}

  BatchCreateRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: BatchCreateAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [dynamodb:PutItem], Resource: {Fn::GetAtt: [MetadataTable, Arn]}}
              - {Effect: Allow, Action: [s3:PutObject], Resource: {Fn::Sub: '${UploadsBucket.Arn}/uploads/*'}}

  BatchCompleteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: BatchCompleteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:UpdateItem], Resource: {Fn::GetAtt: [MetadataTable, Arn]}}
              - {Effect: Allow, Action: [s3:GetObject, s3:PutObject], Resource: [{Fn::Sub: '${UploadsBucket.Arn}/uploads/*'}, {Fn::Sub: '${UploadsBucket.Arn}/zips/*'}]}

  GetTransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: GetTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:UpdateItem], Resource: {Fn::GetAtt: [MetadataTable, Arn]}}
              - {Effect: Allow, Action: [s3:GetObject], Resource: [{Fn::Sub: '${UploadsBucket.Arn}/uploads/*'}, {Fn::Sub: '${UploadsBucket.Arn}/zips/*'}]}

  ListTransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: ListTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: [dynamodb:Query], Resource: [{Fn::GetAtt: [MetadataTable, Arn]}, {Fn::Sub: '${MetadataTable.Arn}/index/OwnerIndex'}]}]

  DeleteTransferRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: DeleteTransferAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [dynamodb:GetItem, dynamodb:DeleteItem], Resource: {Fn::GetAtt: [MetadataTable, Arn]}}
              - {Effect: Allow, Action: [s3:DeleteObject], Resource: [{Fn::Sub: '${UploadsBucket.Arn}/uploads/*'}, {Fn::Sub: '${UploadsBucket.Arn}/zips/*'}]}

  SendEmailRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument: {Version: '2012-10-17', Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: sts:AssumeRole}]}
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: SendEmailAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - {Effect: Allow, Action: [ses:SendEmail], Resource: '*'}
              - {Effect: Allow, Action: [dynamodb:GetItem], Resource: {Fn::GetAtt: [MetadataTable, Arn]}}

  BatchCreateFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: {Fn::GetAtt: [BatchCreateRole, Arn]}
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          TABLE_NAME: {Ref: MetadataTable}
          UPLOADS_BUCKET: {Ref: UploadsBucket}
          MAX_FILES: '20'
          MAX_TOTAL_SIZE: '2147483648'
          MAX_FILE_SIZE: '2147483648'
          ALLOWED_ORIGIN: {Fn::Sub: 'https://${CloudFrontDistribution.DomainName}'}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb');
          const {DynamoDBDocumentClient,PutCommand}=require('@aws-sdk/lib-dynamodb');
          const {S3Client,PutObjectCommand}=require('@aws-sdk/client-s3');
          const {getSignedUrl}=require('@aws-sdk/s3-request-presigner');
          const crypto=require('crypto'); const ddb=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s3=new S3Client({});
          const h=()=>({'Access-Control-Allow-Origin':process.env.ALLOWED_ORIGIN,'Access-Control-Allow-Methods':'POST,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization,X-Completion-Token','Content-Type':'application/json'}); const out=(s,b)=>({statusCode:s,headers:h(),body:JSON.stringify(b)}); const fail=(s,c,m)=>out(s,{success:false,error:{code:c,message:m}});
          function validate(files){if(!Array.isArray(files)||files.length<1||files.length>20)throw[400,'INVALID_FILE_LIST','Choose between 1 and 20 files.'];let total=0;for(const f of files){if(!f||typeof f.fileName!=='string'||!f.fileName.trim()||f.fileName.length>255)throw[400,'INVALID_FILE_NAME','Invalid file name.'];if(!Number.isSafeInteger(f.fileSize)||f.fileSize<=0||f.fileSize>2147483648)throw[413,'FILE_TOO_LARGE','File exceeds the maximum size.'];if(typeof f.contentType!=='string'||f.contentType.length<1||f.contentType.length>200||!/^[\w.+-]+\/[\w.+-]+$/.test(f.contentType))throw[400,'INVALID_CONTENT_TYPE','Invalid content type.'];total+=f.fileSize;if(total>2147483648)throw[413,'TOTAL_SIZE_TOO_LARGE','Total upload size exceeds the limit.'];}return total;}
          exports.handler=async e=>{if(e?.requestContext?.http?.method==='OPTIONS')return out(204,null);try{const b=typeof e.body==='string'?JSON.parse(e.body):e.body||{};const totalSize=validate(b.files);const transferId=crypto.randomUUID();const completionToken=crypto.randomUUID();const expiresAt=new Date(Date.now()+604800000);const ownerId=e.requestContext?.authorizer?.claims?.sub||e.requestContext?.authorizer?.jwt?.claims?.sub||'guest';const files=b.files.map(f=>({fileName:f.fileName.trim(),fileSize:f.fileSize,contentType:f.contentType,objectKey:`uploads/${transferId}/${crypto.randomUUID()}`}));await ddb.send(new PutCommand({TableName:process.env.TABLE_NAME,Item:{transferId,ownerId,status:'pending',completionToken,createdAt:new Date().toISOString(),expiresAt:expiresAt.toISOString(),ttl:Math.floor(expiresAt.getTime()/1000),totalSize,files,isBatch:true,downloadCount:0},ConditionExpression:'attribute_not_exists(transferId)'}));const uploads=await Promise.all(files.map(async f=>({fileName:f.fileName,uploadUrl:await getSignedUrl(s3,new PutObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:f.objectKey,ContentType:f.contentType}),{expiresIn:900})})));return out(201,{success:true,data:{transferId,completionToken,uploads,expiresAt:expiresAt.toISOString()}});}catch(x){console.error('batch-create failed',{name:x?.name});if(Array.isArray(x)&&x.length===3)return fail(x[0],x[1],x[2]);if(x instanceof SyntaxError)return fail(400,'INVALID_REQUEST','Malformed request body.');return fail(500,'INTERNAL_ERROR','Unable to create transfer.');}};

  BatchCompleteFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: {Fn::GetAtt: [BatchCompleteRole, Arn]}
      Timeout: 900
      MemorySize: 1024
      EphemeralStorage: {Size: 10240}
      Environment:
        Variables:
          TABLE_NAME: {Ref: MetadataTable}
          UPLOADS_BUCKET: {Ref: UploadsBucket}
          MAX_ARCHIVE_BYTES: '2147483648'
          ALLOWED_ORIGIN: {Fn::Sub: 'https://${CloudFrontDistribution.DomainName}'}
      Layers: {Fn::If: [HasArchiverLayer, [{Ref: ArchiverLayerArn}], {Ref: AWS::NoValue}]}
      Code:
        ZipFile: |
          const fs=require('fs'); const path=require('path'); const archiver=require('archiver'); const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,GetCommand,UpdateCommand}=require('@aws-sdk/lib-dynamodb'); const {S3Client,GetObjectCommand,PutObjectCommand,HeadObjectCommand}=require('@aws-sdk/client-s3');
          const ddb=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s3=new S3Client({}); const h=()=>({'Access-Control-Allow-Origin':process.env.ALLOWED_ORIGIN,'Access-Control-Allow-Methods':'POST,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization,X-Completion-Token','Content-Type':'application/json'}); const out=(s,b)=>({statusCode:s,headers:h(),body:JSON.stringify(b)}); const fail=(s,c,m)=>out(s,{success:false,error:{code:c,message:m}}); const header=(e,name)=>{const headers=e?.headers||{};const wanted=name.toLowerCase();const key=Object.keys(headers).find(k=>k.toLowerCase()===wanted);return key?String(headers[key]||'').trim():'';};
          exports.handler=async e=>{if(e?.requestContext?.http?.method==='OPTIONS')return out(204,null);const id=e?.pathParameters?.id;if(!id||!/^[0-9a-f-]{36}$/i.test(id))return fail(400,'INVALID_TRANSFER_ID','Invalid transfer ID.');const providedToken=header(e,'X-Completion-Token');if(!providedToken||providedToken.length>128)return fail(401,'INVALID_COMPLETION_TOKEN','A valid completion token is required.');const work=path.join('/tmp',`${id}.zip`);try{const item=(await ddb.send(new GetCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}))).Item;if(!item)return fail(404,'TRANSFER_NOT_FOUND','Transfer not found.');if(!item.completionToken||providedToken!==String(item.completionToken))return fail(401,'INVALID_COMPLETION_TOKEN','Invalid completion token.');if(item.expiresAt&&Date.parse(item.expiresAt)<=Date.now())return fail(410,'TRANSFER_EXPIRED','Transfer expired.');if(!item.isBatch)return fail(409,'INVALID_TRANSFER_TYPE','This is not a batch transfer.');if(item.status==='ready'&&item.zipKey)return out(200,{success:true,data:{transferId:id,status:'ready'}});if(!Array.isArray(item.files)||!item.files.length)return fail(409,'UPLOAD_METADATA_MISSING','Transfer upload metadata is incomplete.');const archive=archiver('zip',{zlib:{level:6}});const write=fs.createWriteStream(work);const finished=new Promise((resolve,reject)=>{write.once('close',resolve);write.once('error',reject);archive.once('error',reject);});archive.pipe(write);let total=0;for(const f of item.files){if(!f.objectKey||f.objectKey!==`uploads/${id}/${f.objectKey.split('/').pop()}`)return fail(500,'INVALID_STORAGE_REFERENCE','Transfer storage metadata is invalid.');const head=await s3.send(new HeadObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:f.objectKey}));const actual=Number(head.ContentLength||0);if(actual!==Number(f.fileSize))return fail(409,'UPLOAD_SIZE_MISMATCH','One or more uploaded files do not match their declared size.');if(head.ContentType&&head.ContentType!==f.contentType)return fail(409,'UPLOAD_TYPE_MISMATCH','One or more uploaded files do not match their declared type.');total+=actual;if(total>2147483648)return fail(413,'TOTAL_SIZE_TOO_LARGE','The transfer exceeds the archive size limit.');const obj=await s3.send(new GetObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:f.objectKey}));archive.append(obj.Body,{name:String(f.fileName||'file').replace(/[\\/\r\n]/g,'_').slice(0,180)||'file'});}await archive.finalize();await finished;const stat=fs.statSync(work);if(stat.size>2147483648)return fail(413,'ARCHIVE_TOO_LARGE','The generated archive exceeds the limit.');await s3.send(new PutObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:`zips/${id}.zip`,Body:fs.createReadStream(work),ContentLength:stat.size,ContentType:'application/zip'}));const updated=await ddb.send(new UpdateCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id},UpdateExpression:'SET #status=:ready,zipKey=:zipKey,archiveSize=:archiveSize,completedAt=:completedAt',ExpressionAttributeNames:{'#status':'status'},ExpressionAttributeValues:{':pending':'pending',':ready':'ready',':zipKey':`zips/${id}.zip`,':archiveSize':stat.size,':completedAt':new Date().toISOString()},ConditionExpression:'#status=:pending',ReturnValues:'ALL_NEW'}));return out(200,{success:true,data:{transferId:id,status:updated.Attributes.status}});}catch(x){console.error('batch-complete failed',{name:x?.name});if(x?.name==='NotFound'||x?.$metadata?.httpStatusCode===404)return fail(409,'UPLOADS_NOT_READY','One or more files have not finished uploading.');if(x?.name==='ConditionalCheckFailedException')return out(200,{success:true,data:{transferId:id,status:'ready'}});return fail(500,'INTERNAL_ERROR','Unable to finalize transfer.');}finally{try{fs.unlinkSync(work);}catch(_){}}};

  GetTransferFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: {Fn::GetAtt: [GetTransferRole, Arn]}
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables: {TABLE_NAME: {Ref: MetadataTable}, UPLOADS_BUCKET: {Ref: UploadsBucket}, ALLOWED_ORIGIN: {Fn::Sub: 'https://${CloudFrontDistribution.DomainName}'}}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,GetCommand,UpdateCommand}=require('@aws-sdk/lib-dynamodb'); const {S3Client,GetObjectCommand}=require('@aws-sdk/client-s3'); const {getSignedUrl}=require('@aws-sdk/s3-request-presigner'); const ddb=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s3=new S3Client({}); const h=()=>({'Access-Control-Allow-Origin':process.env.ALLOWED_ORIGIN,'Access-Control-Allow-Methods':'GET,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}); const out=(s,b)=>({statusCode:s,headers:h(),body:JSON.stringify(b)}); const fail=(s,c,m)=>out(s,{success:false,error:{code:c,message:m}}); const safe=v=>String(v||'download').replace(/[\r\n"\\/]/g,'_').slice(0,180)||'download';
          exports.handler=async e=>{if(e?.requestContext?.http?.method==='OPTIONS')return out(204,null);try{const id=e?.pathParameters?.id;if(!id||!/^[0-9a-f-]{36}$/i.test(id))return fail(400,'INVALID_TRANSFER_ID','Invalid transfer ID.');const item=(await ddb.send(new GetCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}))).Item;if(!item)return fail(404,'TRANSFER_NOT_FOUND','Transfer not found.');if(item.expiresAt&&Date.parse(item.expiresAt)<=Date.now())return fail(410,'TRANSFER_EXPIRED','Transfer expired.');if(item.status!=='ready')return fail(409,'TRANSFER_NOT_READY','This transfer is not ready for download.');const key=item.isBatch?item.zipKey:item.objectKey;if(!key||!((item.isBatch&&key===`zips/${id}.zip`)||(!item.isBatch&&key.startsWith('uploads/'))))return fail(500,'INVALID_STORAGE_REFERENCE','Transfer storage metadata is invalid.');const fileName=safe(item.isBatch?`CloudDrop-${id}.zip`:item.originalFileName);const downloadUrl=await getSignedUrl(s3,new GetObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:key,ResponseContentDisposition:`attachment; filename="${fileName}"`}),{expiresIn:300});await ddb.send(new UpdateCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id},UpdateExpression:'ADD downloadCount :one',ExpressionAttributeValues:{':one':1}}));return out(200,{success:true,data:{downloadUrl,fileName,fileSize:item.isBatch?item.archiveSize||item.totalSize:item.fileSize,fileCount:item.isBatch?(Array.isArray(item.files)?item.files.length:1):1,expiresAt:item.expiresAt}});}catch(x){console.error('get-transfer failed',{name:x?.name});return fail(500,'INTERNAL_ERROR','Unable to prepare download.')}};

  ListTransfersFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: {Fn::GetAtt: [ListTransferRole, Arn]}
      Timeout: 10
      MemorySize: 256
      Environment: {Variables: {TABLE_NAME: {Ref: MetadataTable}, ALLOWED_ORIGIN: {Fn::Sub: 'https://${CloudFrontDistribution.DomainName}'}}}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,QueryCommand}=require('@aws-sdk/lib-dynamodb'); const ddb=DynamoDBDocumentClient.from(new DynamoDBClient({})); const h=()=>({'Access-Control-Allow-Origin':process.env.ALLOWED_ORIGIN,'Access-Control-Allow-Methods':'GET,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}); const out=(s,b)=>({statusCode:s,headers:h(),body:JSON.stringify(b)}); const fail=(s,c,m)=>out(s,{success:false,error:{code:c,message:m}}); const decode=v=>{try{return JSON.parse(Buffer.from(v,'base64url').toString('utf8'));}catch(_){return null;}};
          exports.handler=async e=>{if(e?.requestContext?.http?.method==='OPTIONS')return out(204,null);try{const ownerId=e?.requestContext?.authorizer?.claims?.sub;if(!ownerId)return fail(401,'AUTHENTICATION_REQUIRED','Authentication required.');const p=e.queryStringParameters||{};const limit=Math.min(Math.max(Number(p.limit||25),1),50);const input={TableName:process.env.TABLE_NAME,IndexName:'OwnerIndex',KeyConditionExpression:'ownerId=:ownerId',ExpressionAttributeValues:{':ownerId':ownerId},Limit:limit,ScanIndexForward:false};if(p.nextToken){const key=decode(p.nextToken);if(!key)return fail(400,'INVALID_PAGE_TOKEN','Invalid pagination token.');input.ExclusiveStartKey=key;}const r=await ddb.send(new QueryCommand(input));const items=(r.Items||[]).map(item=>{const {completionToken,...safeItem}=item;return safeItem;});return out(200,{success:true,data:items,nextToken:r.LastEvaluatedKey?Buffer.from(JSON.stringify(r.LastEvaluatedKey)).toString('base64url'):null});}catch(x){console.error('list-transfers failed',{name:x?.name});return fail(500,'INTERNAL_ERROR','Unable to load transfers.')}};

  DeleteTransferFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: {Fn::GetAtt: [DeleteTransferRole, Arn]}
      Timeout: 15
      MemorySize: 256
      Environment: {Variables: {TABLE_NAME: {Ref: MetadataTable}, UPLOADS_BUCKET: {Ref: UploadsBucket}, ALLOWED_ORIGIN: {Fn::Sub: 'https://${CloudFrontDistribution.DomainName}'}}}
      Code:
        ZipFile: |
          const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,GetCommand,DeleteCommand}=require('@aws-sdk/lib-dynamodb'); const {S3Client,DeleteObjectCommand}=require('@aws-sdk/client-s3'); const ddb=DynamoDBDocumentClient.from(new DynamoDBClient({})); const s3=new S3Client({}); const h=()=>({'Access-Control-Allow-Origin':process.env.ALLOWED_ORIGIN,'Access-Control-Allow-Methods':'DELETE,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}); const out=(s,b)=>({statusCode:s,headers:h(),body:JSON.stringify(b)}); const fail=(s,c,m)=>out(s,{success:false,error:{code:c,message:m}});
          exports.handler=async e=>{if(e?.requestContext?.http?.method==='OPTIONS')return out(204,null);try{const id=e?.pathParameters?.id;const ownerId=e?.requestContext?.authorizer?.claims?.sub;if(!ownerId)return fail(401,'AUTHENTICATION_REQUIRED','Authentication required.');if(!id||!/^[0-9a-f-]{36}$/i.test(id))return fail(400,'INVALID_TRANSFER_ID','Invalid transfer ID.');const item=(await ddb.send(new GetCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}))).Item;if(!item)return fail(404,'TRANSFER_NOT_FOUND','Transfer not found.');if(item.ownerId!==ownerId)return fail(403,'FORBIDDEN','You do not have permission to delete this transfer.');await ddb.send(new DeleteCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id},ConditionExpression:'ownerId=:ownerId',ExpressionAttributeValues:{':ownerId':ownerId}}));const keys=[];if(item.objectKey)keys.push(item.objectKey);if(item.zipKey)keys.push(item.zipKey);if(Array.isArray(item.files))for(const f of item.files)if(f.objectKey)keys.push(f.objectKey);for(const key of [...new Set(keys)]){try{await s3.send(new DeleteObjectCommand({Bucket:process.env.UPLOADS_BUCKET,Key:key}));}catch(x){console.error('delete object cleanup failed',{name:x?.name});}}return out(200,{success:true,data:{transferId:id,deleted:true}});}catch(x){console.error('delete-transfer failed',{name:x?.name});if(x?.name==='ConditionalCheckFailedException')return fail(403,'FORBIDDEN','You do not have permission to delete this transfer.');return fail(500,'INTERNAL_ERROR','Unable to delete transfer.')}};

  SendEmailFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: nodejs20.x
      Handler: index.handler
      Role: {Fn::GetAtt: [SendEmailRole, Arn]}
      Timeout: 15
      MemorySize: 256
      Environment:
        Variables:
          SES_SOURCE_EMAIL: {Ref: SesSourceEmail}
          TABLE_NAME: {Ref: MetadataTable}
          FRONTEND_BASE_URL: {Fn::Sub: 'https://${CloudFrontDistribution.DomainName}'}
          ALLOWED_ORIGIN: {Fn::Sub: 'https://${CloudFrontDistribution.DomainName}'}
      Code:
        ZipFile: |
          const {SESClient,SendEmailCommand}=require('@aws-sdk/client-ses'); const {DynamoDBClient}=require('@aws-sdk/client-dynamodb'); const {DynamoDBDocumentClient,GetCommand}=require('@aws-sdk/lib-dynamodb'); const ses=new SESClient({}); const ddb=DynamoDBDocumentClient.from(new DynamoDBClient({})); const h=()=>({'Access-Control-Allow-Origin':process.env.ALLOWED_ORIGIN,'Access-Control-Allow-Methods':'POST,OPTIONS','Access-Control-Allow-Headers':'Content-Type,Authorization','Content-Type':'application/json'}); const out=(s,b)=>({statusCode:s,headers:h(),body:JSON.stringify(b)}); const fail=(s,c,m)=>out(s,{success:false,error:{code:c,message:m}}); const email=/^[^\s@]+@[^\s@]+\.[^\s@]+$/; const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
          exports.handler=async e=>{if(e?.requestContext?.http?.method==='OPTIONS')return out(204,null);try{if(!process.env.SES_SOURCE_EMAIL)return fail(503,'EMAIL_SHARING_DISABLED','Email sharing is not enabled for this deployment.');const b=typeof e.body==='string'?JSON.parse(e.body):e.body||{};const to=String(b.to||'').trim();const id=String(b.transferId||'').trim();if(!email.test(to)||to.length>254)return fail(400,'INVALID_EMAIL','Enter a valid recipient email.');if(!/^[0-9a-f-]{36}$/i.test(id))return fail(400,'INVALID_TRANSFER_ID','Invalid transfer ID.');const item=(await ddb.send(new GetCommand({TableName:process.env.TABLE_NAME,Key:{transferId:id}}))).Item;if(!item)return fail(404,'TRANSFER_NOT_FOUND','Transfer not found.');if(item.expiresAt&&Date.parse(item.expiresAt)<=Date.now())return fail(410,'TRANSFER_EXPIRED','Transfer expired.');if(item.status!=='ready')return fail(409,'TRANSFER_NOT_READY','The transfer is not ready to share.');const link=`${process.env.FRONTEND_BASE_URL}/t/${encodeURIComponent(id)}`;const name=item.isBatch?'CloudDrop transfer':String(item.originalFileName||'CloudDrop transfer').slice(0,180);await ses.send(new SendEmailCommand({Source:process.env.SES_SOURCE_EMAIL,Destination:{ToAddresses:[to]},Message:{Subject:{Data:`${name} shared via CloudDrop`,Charset:'UTF-8'},Body:{Text:{Data:`A CloudDrop transfer is ready for download:\n${link}\n\nThis link expires with the transfer.`,Charset:'UTF-8'},Html:{Data:`<p>A CloudDrop transfer is ready for download.</p><p><strong>${esc(name)}</strong></p><p><a href="${esc(link)}">Download files</a></p><p>This link expires with the transfer.</p>`,Charset:'UTF-8'}}}}));return out(200,{success:true,data:{sent:true}});}catch(x){console.error('send-email failed',{name:x?.name});return fail(500,'EMAIL_SEND_FAILED','Unable to send transfer email.')}};

