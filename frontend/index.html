    async function copyLinkToClipboard(link) {
      if (!link) return alert('No link to copy!');
      try {
        await navigator.clipboard.writeText(link);
        alert('✅ Link copied!');
      } catch {
        const temp = document.createElement('input');
        temp.value = link;
        document.body.appendChild(temp);
        temp.select();
        document.execCommand('copy');
        document.body.removeChild(temp);
        alert('✅ Link copied!');
      }
    }

    function resetUpload() {
      document.getElementById('upload-result').style.display = 'none';
      document.getElementById('upload-content').style.display = 'block';
      document.getElementById('upload-progress').style.display = 'none';
    }

    dropZone.addEventListener('click', (e) => {
      if (e.target.closest('button') || e.target.closest('input')) return;
      fileInput.click();
    });
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });
    fileInput.addEventListener('change', () => handleFiles(fileInput.files));

    async function handleFiles(files) {
      if (!files.length) return;
      const totalSize = Array.from(files).reduce((sum, f) => sum + f.size, 0);
      if (totalSize > 2 * 1024 ** 3) return alert('Total size exceeds 2GB limit.');

      const fileInfos = Array.from(files).map(f => ({
        fileName: f.name,
        fileSize: f.size,
        contentType: f.type || 'application/octet-stream'
      }));

      document.getElementById('upload-content').style.display = 'none';
      document.getElementById('upload-progress').style.display = 'block';
      updateProgress(0);

      try {
        const res = await fetch(`${API_BASE}/batch`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ files: fileInfos })
        });
        const data = await res.json();
        const transferId = data.transferId;
        const uploads = data.uploads;

        let uploaded = 0;
        for (const file of files) {
          const uploadInfo = uploads.find(u => u.fileName === file.name);
          if (!uploadInfo) continue;
          const uploadRes = await fetch(uploadInfo.uploadUrl, {
            method: 'PUT',
            body: file,
            headers: { 'Content-Type': file.type || 'application/octet-stream' }
          });
          if (!uploadRes.ok) throw new Error(`Upload failed for ${file.name}`);
          uploaded++;
          const progress = Math.round((uploaded / files.length) * 100);
          updateProgress(progress);
        }

        await fetch(`${API_BASE}/batch/${transferId}/complete`, { method: 'POST' });

        updateProgress(100);
        document.getElementById('upload-progress').style.display = 'none';
        document.getElementById('upload-result').style.display = 'block';
        const shareLink = `${window.location.origin}/t/${data.transferId}`;
        document.getElementById('share-link').value = shareLink;
        try { await navigator.clipboard.writeText(shareLink); } catch(e) {}
      } catch (err) {
        alert('❌ Upload failed: ' + err.message);
        resetUpload();
      }
    }

    function updateProgress(val) {
      document.getElementById('progress-bar').value = val;
      document.getElementById('progress-text').textContent = val + '%';
    }
  </script>
