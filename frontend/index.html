<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Fast, simple and secure serverless file sharing with CloudDrop." />
  <title>CloudDrop — Fast, Simple, Secure</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='/'">☁️ <span>CloudDrop</span></div>
    <nav>
      <span id="user-status">👤 Guest</span>
      <button id="auth-btn" type="button">Log In</button>
      <button id="signup-btn" type="button" class="btn-primary">Sign Up</button>
      <div class="theme-toggle" id="themeToggle" title="Toggle theme" role="button" tabindex="0">🌓</div>
    </nav>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Fast, Simple, Secure File Sharing.</h1>
      <p>Drop multiple files — CloudDrop packages them into one secure ZIP.</p>
    </section>

    <section class="upload-zone" id="drop-zone" aria-label="File upload area">
      <div class="upload-content" id="upload-content">
        <div class="upload-icon">📁</div>
        <p><strong>Drop files here</strong> or click to select</p>
        <small>Maximum total size: 2GB · Up to 50 files</small>
        <input type="file" id="file-input" multiple hidden />
      </div>

      <div id="upload-progress" hidden>
        <progress id="progress-bar" value="0" max="100"></progress>
        <span id="progress-text">0%</span>
        <p id="progress-status" class="muted">Preparing upload…</p>
      </div>

      <div id="upload-result" hidden>
        <p id="result-title">✅ Transfer created!</p>
        <input type="text" id="share-link" readonly aria-label="Share link" />
        <br><br>
        <button id="copy-btn" type="button" class="action-btn">📋 Copy Link</button>
        <input type="email" id="recipient-email" placeholder="Recipient email (optional)" autocomplete="email" />
        <button id="email-btn" type="button" class="action-btn">✉️ Send</button>
        <br><br>
        <button id="new-upload-btn" type="button" class="action-btn danger">➕ New Upload</button>
      </div>
    </section>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/theme.js"></script>
  <script>
    (() => {
      const config = window.CLOUDDROP_CONFIG || {};
      const API_BASE = String(config.apiBase || '').replace(/\/$/, '');
      const token = sessionStorage.getItem('idToken') || sessionStorage.getItem('accessToken');
      const statusEl = document.getElementById('user-status');
      const authBtn = document.getElementById('auth-btn');
      const signupBtn = document.getElementById('signup-btn');
      if (token) {
        statusEl.textContent = '✅ Logged in';
        authBtn.textContent = 'Dashboard';
        authBtn.onclick = () => window.location.href = '/dashboard.html';
        signupBtn.hidden = true;
      } else {
        authBtn.onclick = () => window.location.href = '/login.html';
        signupBtn.onclick = () => window.location.href = '/signup.html';
      }

      const dropZone = document.getElementById('drop-zone');
      const fileInput = document.getElementById('file-input');
      const MAX_TOTAL = 2 * 1024 ** 3;
      const MAX_FILES = 50;
      const setVisible = (id, visible) => { document.getElementById(id).hidden = !visible; };
      const updateProgress = (value, status = '') => {
        document.getElementById('progress-bar').value = value;
        document.getElementById('progress-text').textContent = `${value}%`;
        if (status) document.getElementById('progress-status').textContent = status;
      };

      async function copyLinkToClipboard(link) {
        if (!link) return;
        try { await navigator.clipboard.writeText(link); }
        catch {
          const temp = document.createElement('input');
          temp.value = link; document.body.appendChild(temp); temp.select(); document.execCommand('copy'); temp.remove();
        }
        alert('✅ Link copied!');
      }
      document.getElementById('copy-btn').addEventListener('click', () => copyLinkToClipboard(document.getElementById('share-link').value));

      document.getElementById('email-btn').addEventListener('click', async () => {
        const email = document.getElementById('recipient-email').value.trim();
        const transferId = document.getElementById('share-link').dataset.transferId;
        if (!email || !transferId) return alert('Enter a recipient email after the upload is ready.');
        const button = document.getElementById('email-btn'); button.disabled = true;
        try {
          const res = await fetch(`${API_BASE}/send-email`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({to:email,transferId}) });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.error || 'Email sending is unavailable.');
          alert('✅ Email sent successfully!');
        } catch (error) { alert(`❌ ${error.message}`); }
        finally { button.disabled = false; }
      });

      document.getElementById('new-upload-btn').addEventListener('click', resetUpload);
      function resetUpload() {
        setVisible('upload-result', false); setVisible('upload-progress', false); setVisible('upload-content', true);
        fileInput.value = ''; updateProgress(0, 'Preparing upload…');
      }

      dropZone.addEventListener('click', event => { if (!event.target.closest('button') && !event.target.closest('input')) fileInput.click(); });
      dropZone.addEventListener('dragover', event => { event.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', event => { event.preventDefault(); dropZone.classList.remove('dragover'); handleFiles(event.dataTransfer.files); });
      fileInput.addEventListener('change', () => handleFiles(fileInput.files));

      async function apiJson(path, options = {}) {
        if (!API_BASE) throw new Error('CloudDrop API is not configured.');
        const res = await fetch(`${API_BASE}${path}`, options);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || `Request failed (${res.status})`);
        return data;
      }

      async function waitForArchive(transferId) {
        const deadline = Date.now() + 20 * 60 * 1000;
        while (Date.now() < deadline) {
          const res = await fetch(`${API_BASE}/transfer/${encodeURIComponent(transferId)}`);
          const data = await res.json().catch(() => ({}));
          if (res.ok) return data;
          if (res.status === 410 || res.status === 404) throw new Error(data.error || 'Transfer is no longer available.');
          if (res.status === 400 && ['pending', 'processing'].includes(data.status)) {
            updateProgress(100, data.status === 'processing' ? 'Creating secure ZIP…' : 'Waiting for archive job…');
            await new Promise(resolve => setTimeout(resolve, 3000));
            continue;
          }
          if (data.status === 'failed') throw new Error('ZIP creation failed. Please retry the upload.');
          throw new Error(data.error || 'Unable to finish the transfer.');
        }
        throw new Error('ZIP creation timed out. Please try the upload again.');
      }

      async function handleFiles(fileList) {
        const files = Array.from(fileList || []);
        if (!files.length) return;
        if (files.length > MAX_FILES) return alert(`You can upload up to ${MAX_FILES} files.`);
        const totalSize = files.reduce((sum, file) => sum + file.size, 0);
        if (totalSize > MAX_TOTAL) return alert('Total size exceeds the 2GB limit.');
        if (files.some(file => file.name.length > 255)) return alert('A file name is too long (maximum 255 characters).');
        if (!API_BASE) return alert('CloudDrop is not configured yet. Please deploy the application first.');

        const fileInfos = files.map(file => ({fileName:file.name,fileSize:file.size,contentType:file.type || 'application/octet-stream'}));
        setVisible('upload-content', false); setVisible('upload-result', false); setVisible('upload-progress', true); updateProgress(0, 'Creating secure upload URLs…');
        try {
          const data = await apiJson('/batch', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({files:fileInfos}) });
          let uploadedBytes = 0;
          for (const file of files) {
            const uploadInfo = data.uploads.find(item => item.fileName === file.name);
            if (!uploadInfo) throw new Error(`No upload URL returned for ${file.name}`);
            const uploadRes = await fetch(uploadInfo.uploadUrl, {method:'PUT',body:file,headers:{'Content-Type':file.type || 'application/octet-stream'}});
            if (!uploadRes.ok) throw new Error(`Upload failed for ${file.name}`);
            uploadedBytes += file.size; updateProgress(Math.round((uploadedBytes / totalSize) * 100), `Uploaded ${file.name}`);
          }
          updateProgress(100, 'Creating secure ZIP…');
          await apiJson(`/batch/${encodeURIComponent(data.transferId)}/complete`, {method:'POST'});
          const ready = await waitForArchive(data.transferId);
          const shareLink = `${window.location.origin}/t/${data.transferId}`;
          const linkInput = document.getElementById('share-link');
          linkInput.value = shareLink; linkInput.dataset.transferId = data.transferId;
          const count = ready.fileCount || files.length;
          document.getElementById('result-title').textContent = `✅ ${count} file${count === 1 ? '' : 's'} ready to share!`;
          setVisible('upload-progress', false); setVisible('upload-result', true);
          await copyLinkToClipboard(shareLink);
        } catch (error) { console.error(error); alert(`❌ Upload failed: ${error.message}`); resetUpload(); }
      }
    })();
  </script>
</body>
</html>
