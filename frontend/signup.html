<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create an optional CloudDrop account"><title>Sign up — CloudDrop</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
  <header class="site-header"><a class="brand" href="/" aria-label="CloudDrop home"><span class="brand-mark">C</span><span>CloudDrop</span></a><button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme">◐</button></header>
  <main class="container page-shell"><section class="auth-container" style="background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)"><span class="eyebrow">OPTIONAL ACCOUNT</span><h2>Create your account.</h2><p style="color:var(--muted);text-align:center;margin-bottom:18px">Manage your own transfers while keeping guest sharing completely frictionless.</p>
    <form id="signup-form"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com"><label for="password">Password</label><input id="password" type="password" autocomplete="new-password" required minlength="12" placeholder="12+ characters"><button id="signup-btn" class="btn btn-primary" type="submit" style="width:100%">Create account</button></form>
    <div id="otp-section" hidden style="margin-top:20px"><p style="color:var(--muted)">Enter the verification code sent to your email.</p><label for="otp">Verification code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456"><button id="confirm-btn" class="btn btn-primary" type="button" style="width:100%;margin-top:12px">Verify email</button><button id="resend-otp" class="text-btn" type="button" style="margin-top:10px">Resend code</button></div>
    <p id="message" role="status" style="margin-top:14px;color:var(--muted)"></p><p style="text-align:center;margin-top:18px;color:var(--muted);font-size:13px">Already have an account? <a href="/login.html" style="color:var(--accent)">Log in</a></p>
  </section></main>
  <script src="/js/config.js"></script><script src="/js/theme.js"></script><script>
    (()=>{const c=window.CLOUDDROP_CONFIG||{};const region=c.region||'us-east-1';const clientId=c.cognitoClientId;const endpoint=`https://cognito-idp.${region}.amazonaws.com/`;let username='';const $=id=>document.getElementById(id);async function call(action,payload){if(!clientId)throw new Error('Authentication is not configured for this deployment.');const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/x-amz-json-1.1','X-Amz-Target':`AWSCognitoIdentityProviderService.${action}`},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Authentication request failed.');return d;}
      $('signup-form').addEventListener('submit',async e=>{e.preventDefault();const email=$('email').value.trim(),password=$('password').value;if(password.length<12){$('message').textContent='Use a password with at least 12 characters.';return;}$('signup-btn').disabled=true;$('message').textContent='Creating account…';try{await call('SignUp',{ClientId:clientId,Username:email,Password:password,UserAttributes:[{Name:'email',Value:email}]});username=email;$('signup-form').hidden=true;$('otp-section').hidden=false;$('message').textContent='Verification code sent.';}catch(x){$('message').textContent=x.message;}finally{$('signup-btn').disabled=false;}});
      $('confirm-btn').addEventListener('click',async()=>{const code=$('otp').value.trim();if(!/^\d{6}$/.test(code)){$('message').textContent='Enter the 6-digit verification code.';return;}$('confirm-btn').disabled=true;try{await call('ConfirmSignUp',{ClientId:clientId,Username:username,ConfirmationCode:code});$('message').textContent='Email verified. Redirecting to login…';setTimeout(()=>location.href='/login.html',900);}catch(x){$('message').textContent=x.message;}finally{$('confirm-btn').disabled=false;}});
      $('resend-otp').addEventListener('click',async()=>{if(!username)return;try{await call('ResendConfirmationCode',{ClientId:clientId,Username:username});$('message').textContent='A new code was sent.';}catch(x){$('message').textContent=x.message;}});
    })();
  </script>
</body>
</html>
