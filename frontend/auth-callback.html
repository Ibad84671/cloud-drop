<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Completing CloudDrop sign in"><title>Signing in — CloudDrop</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header class="site-header"><a class="brand" href="/" aria-label="CloudDrop home"><span class="brand-mark">C</span><span>CloudDrop</span></a><button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme">◐</button></header>
<main class="container page-shell"><section class="auth-container" style="background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)"><span class="eyebrow">AUTHENTICATION</span><h2 id="title">Signing you in…</h2><p id="message" role="status" style="color:var(--muted);text-align:center">Please wait while CloudDrop completes authentication.</p></section></main>
<script src="/js/config.js"></script><script src="/js/theme.js"></script>
<script>
(()=>{ 'use strict'; const c=window.CLOUDDROP_CONFIG||{}; const $=id=>document.getElementById(id);
async function exchange(code){const verifier=sessionStorage.getItem('cloudDropPkceVerifier');if(!verifier||!c.cognitoDomain||!c.cognitoClientId)throw new Error('Authentication session is missing or expired.');const body=new URLSearchParams({grant_type:'authorization_code',client_id:c.cognitoClientId,code,redirect_uri:`${location.origin}/auth-callback.html`,code_verifier:verifier});const r=await fetch(`https://${c.cognitoDomain}/oauth2/token`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body});const d=await r.json().catch(()=>({}));if(!r.ok||!d.id_token)throw new Error(d.error_description||'Authentication failed.');sessionStorage.removeItem('cloudDropPkceVerifier');sessionStorage.setItem('idToken',d.id_token);if(d.access_token)sessionStorage.setItem('accessToken',d.access_token);if(d.refresh_token)sessionStorage.setItem('refreshToken',d.refresh_token);if(d.expires_in)sessionStorage.setItem('tokenExpiresAt',String(Date.now()+Number(d.expires_in)*1000));}
(async()=>{try{if(!c.cognitoDomain||!c.cognitoClientId)throw new Error('Authentication is not configured for this deployment.');const p=new URLSearchParams(location.search);if(p.get('error'))throw new Error(p.get('error_description')||'Authentication was cancelled.');const code=p.get('code');if(!code)throw new Error('Authentication response did not contain a code.');await exchange(code);$('title').textContent='You are signed in.';$('message').textContent='Opening your CloudDrop dashboard…';location.replace('/dashboard.html');}catch(e){console.error('auth callback failed',e.name);$('title').textContent='Sign in failed';$('message').textContent=e.message;setTimeout(()=>location.replace('/login.html'),2200);}})();})();
</script>
</body>
</html>
