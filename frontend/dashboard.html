<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Manage your CloudDrop transfers"><title>Dashboard — CloudDrop</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header class="site-header"><a class="brand" href="/" aria-label="CloudDrop home"><span class="brand-mark">C</span><span>CloudDrop</span></a><nav class="nav-actions" aria-label="Account navigation"><span id="user-email" class="user-status">Signed in</span><button id="logout-btn" class="btn btn-ghost" type="button">Log out</button><button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme">◐</button></nav></header>
<main class="container page-shell"><section class="hero" style="text-align:left;max-width:none;margin-bottom:26px"><span class="eyebrow">YOUR CLOUDDROP</span><h1 style="font-size:clamp(38px,6vw,60px)">My <span>transfers.</span></h1><p>Manage transfers created from your account.</p></section><section class="transfer-card" style="max-width:none"><div id="transfers-list" class="table-wrap" style="padding:0;border:0;background:transparent" aria-live="polite">Loading transfers…</div><div id="load-more-wrap" style="margin-top:18px;text-align:center" hidden><button id="load-more" class="btn btn-secondary" type="button">Load more</button></div><div style="margin-top:18px"><a class="btn btn-primary" href="/">Create a transfer</a></div></section></main>
<footer class="site-footer"><span>CloudDrop</span><span>Only you can manage your transfers.</span></footer>
<script src="/js/config.js"></script><script src="/js/theme.js"></script>
<script>
(()=>{ 'use strict'; const c=window.CLOUDDROP_CONFIG||{}; const API=c.apiBase||''; const token=sessionStorage.getItem('accessToken')||sessionStorage.getItem('idToken'); const $=id=>document.getElementById(id); let nextToken=null; if(!token||!API){location.replace('/');return;}
function parseJwt(v){try{const p=v.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');return JSON.parse(atob(p.padEnd(Math.ceil(p.length/4)*4,'=')));}catch(_){return {};}} function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));} function size(v){if(!v)return '—';const mb=v/1048576;return mb<1024?`${mb.toFixed(2)} MB`:`${(mb/1024).toFixed(2)} GB`;}
$('user-email').textContent=parseJwt(token).email||'Signed in';
function row(x){const label=x.isBatch?`${Array.isArray(x.files)?x.files.length:1} files`:(x.originalFileName||'Transfer');return `<tr><td>${esc(label)}</td><td>${size(x.archiveSize||x.fileSize||x.totalSize)}</td><td>${esc(x.status||'unknown')}</td><td>${x.expiresAt?new Date(x.expiresAt).toLocaleDateString():'—'}</td><td>${Number(x.downloadCount||0)}</td><td><button class="text-btn" type="button" data-delete="${esc(x.transferId)}">Delete</button></td></tr>`;}
async function load(append=false){try{const q=new URLSearchParams({limit:'25'});if(nextToken)q.set('nextToken',nextToken);const r=await fetch(`${API}/user/transfers?${q}`,{headers:{Authorization:`Bearer ${token}`}});const b=await r.json().catch(()=>({}));if(r.status===401||r.status===403){console.error('API AUTH FAILED',r.status);console.log('accessToken exists:',!!sessionStorage.getItem('accessToken'));console.log('idToken exists:',!!sessionStorage.getItem('idToken'));throw new Error('API authentication rejected: HTTP '+r.status);}if(!r.ok)throw new Error(b?.error?.message||'Unable to load transfers.');const items=b.data||[];if(!append&&!items.length){$('transfers-list').innerHTML='<div class="state-panel"><strong>No transfers yet.</strong><p>Create your first transfer from the upload page.</p></div>';}else if(!append){$('transfers-list').innerHTML='<table><thead><tr><th>File</th><th>Size</th><th>Status</th><th>Expires</th><th>Downloads</th><th></th></tr></thead><tbody id="transfer-rows"></tbody></table>';}if(items.length)$('transfer-rows').insertAdjacentHTML('beforeend',items.map(row).join(''));nextToken=b.nextToken||null;$('load-more-wrap').hidden=!nextToken;document.querySelectorAll('[data-delete]').forEach(btn=>btn.onclick=()=>remove(btn.dataset.delete));}catch(e){$('transfers-list').innerHTML=`<div class="error-panel"><strong>Unable to load transfers.</strong><p>${esc(e.message)}</p></div>`;}}
async function remove(id){if(!id||!confirm('Delete this transfer? This cannot be undone.'))return;try{const r=await fetch(`${API}/transfer/${encodeURIComponent(id)}`,{method:'DELETE',headers:{Authorization:`Bearer ${token}`}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error(b?.error?.message||'Delete failed.');nextToken=null;await load(false);}catch(e){alert(e.message);}}
$('load-more').onclick=()=>load(true);$('logout-btn').onclick=()=>{sessionStorage.clear();if(c.cognitoDomain&&c.cognitoClientId){const q=new URLSearchParams({client_id:c.cognitoClientId,logout_uri:`${location.origin}/`});location.href=`https://${c.cognitoDomain}/logout?${q}`;}else location.replace('/');};load();})();
</script>
</body>
</html>
