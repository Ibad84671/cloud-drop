<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In — CloudDrop</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <div class="logo" onclick="window.location.href='/'">☁️ <span>CloudDrop</span></div>
    <nav><div class="theme-toggle" id="themeToggle" title="Toggle theme">🌓</div></nav>
  </header>
  <main class="auth-container glass">
    <h2>Welcome Back</h2>
    <form id="login-form">
      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="••••••••" required />
      <button type="submit">Log In</button>
    </form>
    <p style="text-align:center;margin-top:1rem;">
      Don't have an account? <a href="/signup.html" style="color:var(--accent);">Sign Up</a>
    </p>
  </main>
  <script src="/js/theme.js"></script>
  <script>
    const COGNITO_DOMAIN = 'clouddrop-502263855269-dev';
    const CLIENT_ID = '5rp8tss9iu3s1jb4p5qdljog2e';
    const REDIRECT_URI = window.location.origin + '/dashboard.html';
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      window.location.href = `https://${COGNITO_DOMAIN}.auth.us-east-1.amazoncognito.com/login?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
    });
  </script>
</body>
</html>
