<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to manage your CloudDrop transfers"><title>Log in — CloudDrop</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
  <header class="site-header"><a class="brand" href="/" aria-label="CloudDrop home"><span class="brand-mark">C</span><span>CloudDrop</span></a><button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme">◐</button></header>
  <main class="container page-shell"><section class="auth-container" style="background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)"><span class="eyebrow">OPTIONAL ACCOUNT</span><h2>Welcome back.</h2><p style="color:var(--muted);text-align:center;margin-bottom:20px">Sign in to manage transfers. Guest sharing still works without an account.</p><button id="login-btn" class="btn btn-primary" style="width:100%" type="button">Continue with CloudDrop</button><p style="text-align:center;margin-top:16px;color:var(--muted);font-size:13px">New here? <a href="/signup.html" style="color:var(--accent)">Create an account</a></p></section></main>
  <script src="/js/config.js"></script><script src="/js/theme.js"></script><script>
    document.getElementById('login-btn').addEventListener('click',()=>{const c=window.CLOUDDROP_CONFIG||{};if(!c.cognitoDomain||!c.cognitoClientId){alert('Authentication is not configured for this deployment.');return;}const redirect=window.location.origin+'/dashboard.html';window.location.href=`https://${c.cognitoDomain}/login?client_id=${encodeURIComponent(c.cognitoClientId)}&response_type=token&redirect_uri=${encodeURIComponent(redirect)}`;});
  </script>
</body>
</html>
