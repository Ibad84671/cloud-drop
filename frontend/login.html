<!doctype html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Sign in to manage your CloudDrop transfers"><title>Log in — CloudDrop</title><link rel="stylesheet" href="/css/style.css"></head>
<body>
<header class="site-header"><a class="brand" href="/" aria-label="CloudDrop home"><span class="brand-mark">C</span><span>CloudDrop</span></a><button id="themeToggle" class="icon-btn" type="button" aria-label="Toggle color theme">◐</button></header>
<main class="container page-shell"><section class="auth-container" style="background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)"><span class="eyebrow">OPTIONAL ACCOUNT</span><h2>Welcome back.</h2><p style="color:var(--muted);text-align:center;margin-bottom:20px">Sign in to manage transfers. Guest sharing still works without an account.</p><button id="login-btn" class="btn btn-primary" style="width:100%" type="button">Continue with CloudDrop</button><p id="message" role="status" style="text-align:center;margin-top:16px;color:var(--muted);font-size:13px"></p><p style="text-align:center;margin-top:16px;color:var(--muted);font-size:13px">New here? <a href="/signup.html" style="color:var(--accent)">Create an account</a></p></section></main>
<script src="/js/config.js"></script><script src="/js/theme.js"></script>
<script>
(()=>{ 'use strict'; const c=window.CLOUDDROP_CONFIG||{}; const $=id=>document.getElementById(id); function verifier(){const b=new Uint8Array(32);crypto.getRandomValues(b);return btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');} async function start(){if(!c.cognitoDomain||!c.cognitoClientId)throw new Error('Authentication is not configured for this deployment.');const v=verifier();const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));const challenge=btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/g,'');sessionStorage.setItem('cloudDropPkceVerifier',v);const p=new URLSearchParams({client_id:c.cognitoClientId,response_type:'code',scope:'openid email profile',redirect_uri:`${location.origin}/auth-callback.html`,code_challenge_method:'S256',code_challenge:challenge});location.href=`https://${c.cognitoDomain}/oauth2/authorize?${p}`;} $('login-btn').addEventListener('click',async()=>{$('login-btn').disabled=true;$('message').textContent='Opening secure sign-in…';try{await start();}catch(e){$('message').textContent=e.message;$('login-btn').disabled=false;}});})();
</script>
</body>
</html>
