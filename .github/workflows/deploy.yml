name: CloudDrop CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clouddrop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  STACK_NAME: clouddrop-dev
  ENVIRONMENT: dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check merge-conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then exit 1; fi
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find backend/functions frontend -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Run smoke tests
        run: npm test
      - name: Validate CloudFormation
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint --ignore-checks W2531 infrastructure/cfn/main.yaml

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Validate CloudFormation with AWS
        run: aws cloudformation validate-template --template-body file://infrastructure/cfn/main.yaml --region "$AWS_REGION"
      - name: Deploy CloudDrop
        env:
          ARCHIVER_LAYER_ARN: ${{ secrets.ARCHIVER_LAYER_ARN }}
          SES_SOURCE_EMAIL: ${{ secrets.SES_SOURCE_EMAIL }}
        run: ./scripts/deploy.sh
