name: CloudDrop CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: clouddrop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  STACK_NAME: clouddrop-dev
  ENVIRONMENT: dev

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check merge-conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then exit 1; fi
      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          find backend/functions frontend -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done
      - name: Validate CloudFormation syntax
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint infrastructure/cfn/main.yaml
      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://infrastructure/cfn/main.yaml --region "$AWS_REGION"

  deploy:
    name: Deploy
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy CloudFormation
        run: |
          aws cloudformation deploy --template-file infrastructure/cfn/main.yaml --stack-name "$STACK_NAME" --parameter-overrides Environment="$ENVIRONMENT" --capabilities CAPABILITY_IAM
      - name: Generate deployment config
        run: |
          API_URL=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`ApiGatewayURL`].OutputValue' --output text)
          CLIENT_ID=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs[?OutputKey==`CognitoClientId`].OutputValue' --output text)
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          test -n "$API_URL" && test "$API_URL" != "None"
          test -n "$CLIENT_ID" && test "$CLIENT_ID" != "None"
          printf 'window.CLOUDDROP_CONFIG = { apiBase: "%s", cognitoClientId: "%s", cognitoDomain: "clouddrop-%s-%s.auth.%s.amazoncognito.com" };\n' "$API_URL" "$CLIENT_ID" "$ACCOUNT_ID" "$ENVIRONMENT" "$AWS_REGION" > frontend/js/config.js
      - name: Sync frontend
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="clouddrop-frontend-${ENVIRONMENT}-${ACCOUNT_ID}"
          aws s3 sync frontend/ "s3://$BUCKET" --delete
      - name: Invalidate CloudFront
        run: |
          DIST_ID=$(aws cloudformation describe-stack-resource --stack-name "$STACK_NAME" --logical-resource-id CloudFrontDistribution --query StackResourceDetail.PhysicalResourceId --output text)
          test -n "$DIST_ID" && test "$DIST_ID" != "None"
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*'
