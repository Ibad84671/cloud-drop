<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudDrop — Fast, Simple, Secure</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/assets/favicon.ico" />
</head>
<body>
  <header>
    <div class="logo">☁️ CloudDrop</div>
    <nav>
      <a href="/dashboard.html" id="nav-dashboard" style="display:none;">Dashboard</a>
      <button id="auth-btn" onclick="window.location.href='/login.html'">Sign In</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>Fast, Simple, Secure File Sharing.</h1>
      <p>Drop your files below — no account required.</p>
    </section>

    <section class="upload-zone" id="drop-zone">
      <div class="upload-content">
        <div class="upload-icon">📁</div>
        <p><strong>Drop files here</strong> or click to select</p>
        <small>Maximum file size: 2GB</small>
        <input type="file" id="file-input" multiple style="display:none;" />
      </div>
      <div id="upload-progress" style="display:none;">
        <progress id="progress-bar" value="0" max="100"></progress>
        <span id="progress-text">0%</span>
      </div>
      <div id="upload-result" style="display:none;">
        <p>✅ Transfer created!</p>
        <input type="text" id="share-link" readonly />
        <button onclick="copyLink()">Copy Link</button>
        <input type="email" id="recipient-email" placeholder="Recipient email (optional)" />
        <button id="send-email-btn">Send via Email</button>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/upload.js"></script>
</body>
</html>
